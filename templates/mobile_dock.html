{% load static %}
<!-- Floating Liquid Glass Mobile Navigation Bar (Telegram / iOS Style) -->
<nav id="mobile-liquid-dock" class="lg:hidden fixed bottom-3 sm:bottom-4 left-1/2 -translate-x-1/2 z-40 w-[calc(100%-1.5rem)] max-w-[420px] select-none" aria-label="Mobile Navigation">
  <div class="liquid-glass-dock flex items-center justify-around px-2 py-1.5 sm:px-3 sm:py-2">
    
    <!-- 1. Home -->
    <a href="{% url 'index' %}" class="liquid-dock-item" data-nav-link="home">
      <div class="dock-icon-wrapper relative flex items-center justify-center">
        <i class="bi bi-house-door text-xl nav-icon-inactive"></i>
        <i class="bi bi-house-door-fill text-xl nav-icon-active hidden"></i>
      </div>
      <span class="dock-label">Home</span>
    </a>

    <!-- 2. Library -->
    <a href="{% url 'lists' %}" class="liquid-dock-item" data-nav-link="library">
      <div class="dock-icon-wrapper relative flex items-center justify-center">
        <i class="bi bi-bookmarks text-xl nav-icon-inactive"></i>
        <i class="bi bi-bookmarks-fill text-xl nav-icon-active hidden"></i>
      </div>
      <span class="dock-label">Library</span>
    </a>

    <!-- 3. Write -->
    <a href="{% url 'write' %}" class="liquid-dock-item" data-nav-link="write">
      <div class="dock-icon-wrapper relative flex items-center justify-center">
        <i class="bi bi-pencil-square text-xl nav-icon-inactive"></i>
        <i class="bi bi-pencil-square text-xl nav-icon-active hidden"></i>
      </div>
      <span class="dock-label">Write</span>
    </a>

    <!-- 4. Stats -->
    <a href="{% if request.user.is_authenticated %}{% url 'stats' %}{% else %}#{% endif %}" 
       class="liquid-dock-item" 
       data-nav-link="stats"
       {% if not request.user.is_authenticated %}data-auth-modal="signin"{% endif %}>
      <div class="dock-icon-wrapper relative flex items-center justify-center">
        <i class="bi bi-bar-chart-line text-xl nav-icon-inactive"></i>
        <i class="bi bi-bar-chart-line-fill text-xl nav-icon-active hidden"></i>
      </div>
      <span class="dock-label">Stats</span>
    </a>

    <!-- 5. Profile (with round photo) -->
    <a href="{% if request.user.is_authenticated %}{% url 'user_profile' username=request.user.username %}{% else %}#{% endif %}" 
       class="liquid-dock-item" 
       data-nav-link="profile"
       {% if not request.user.is_authenticated %}data-auth-modal="signin"{% endif %}>
      <div class="dock-icon-wrapper relative flex items-center justify-center">
        {% if request.user.is_authenticated and request.user.profile.avatar %}
          <img src="{{ request.user.profile.avatar.url }}" class="w-6 h-6 rounded-full object-cover ring-1.5 ring-black/20 dark:ring-white/30" alt="{{ request.user.username }}">
        {% elif request.user.is_authenticated %}
          <div class="w-6 h-6 rounded-full bg-black text-white dark:bg-white dark:text-black flex items-center justify-center text-[10px] font-bold">
            {{ request.user.username|first|upper }}
          </div>
        {% else %}
          <i class="bi bi-person text-xl nav-icon-inactive"></i>
          <i class="bi bi-person-fill text-xl nav-icon-active hidden"></i>
        {% endif %}
      </div>
      <span class="dock-label">Profile</span>
    </a>

  </div>
</nav>
